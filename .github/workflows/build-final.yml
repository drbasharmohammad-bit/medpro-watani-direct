# Build Watani (Studio source) — FINAL release APK via GitHub Actions
#
# Why this file exists (26 Oct 2026):
# - Local Gradle builds are blocked in this VM: the Gradle daemon starts but
#   the Java client never reaches it over loopback (proven with isolated
#   loopback tests; Gradle 8.7 and 9.1.0 fail identically). GitHub runners
#   do not have this defect, and cloud builds are the approved path since
#   10 Oct 2026 (private repo drbasharmohammad-bit/medpro-watani-app).
# - This workflow is written for the CURRENT Studio Kotlin source, NOT for
#   the old v1 React Native workflow (Node + android/ + assembleRelease).
#   Differences that matter:
#   * No gradlew in the Studio export, so Gradle 9.3.1 (the version pinned
#     in gradle/wrapper/gradle-wrapper.properties) is downloaded on the
#     runner and invoked directly.
#   * No debug.keystore in the export (and .gitignore excludes it), while
#     app/build.gradle.kts points debug signing at ${rootDir}/debug.keystore.
#     The workflow restores ONE stable keystore from GitHub secrets
#     (WATANI_KEYSTORE_BASE64) before building — see below.
#   * The build needs three secrets (set via the repo web UI; the
#     automation token has no secrets permission): WATANI_KEYSTORE_BASE64,
#     WATANI_KEYSTORE_PASSWORD, WATANI_KEY_PASSWORD.
#
# IMPORTANT — one stable signature for all builds (30 Oct 2026):
# Before this change every run generated a FRESH debug keystore, so every
# APK had a different signature: each build was a "different app" (fresh
# install required, local data lost) and a NEW SHA-1 fingerprint that had
# to be registered in Firebase before Google sign-in worked. Now one
# keystore signs every build: updates install over the old version, and
# the SHA-1 below is registered in Firebase ONCE (project
# national-exam-8ecba) and never changes. The next build after this
# change is the LAST one that needs an uninstall first (its signature
# differs from all ephemeral-key builds before it).
#
# Final release build (Nov 2026): same stable key as before, so the
# Firebase SHA-1 never changes; the artifact file is medpro.apk.

name: Build Watani Final APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/home-package, feature/pdfium-reader, feature/flexibility-courses, feature/reader-crash-fix, feature/bidi-subtitle-fix]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets scan (gitleaks — full-audit phase 0 gate)
        run: |
          # Fails the build on any NEW secret. The only allowlisted
          # item is the public-by-design Firebase client key in its
          # two legitimate files (see .gitleaks.toml / audit SEC-001).
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Pre-fetch Robolectric android-all (SDK 34) into the local Maven repo
        run: |
          # Robolectric resolves its android-all jar from Maven at
          # TEST RUNTIME, outside Gradle's download retry/caching:
          # a flaky fetch there fails whole test classes at sandbox
          # creation (seen 22 Nov 2026, run 45015082846 — every
          # Robolectric class died on the fetch, no test ran). Seed
          # the local Maven repository up front with the same retry
          # discipline as the Gradle download step; the resolver
          # then finds the artifact locally and never touches the
          # network for it.
          ver=14-robolectric-10818077-i7
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ver"
          mkdir -p "$dir"
          # Mirror rotation + stall detection: repo1.maven.org
          # crawled at ~100KB/s from a runner on the first attempt
          # (run 45016011258, cancelled after 16 min in this step),
          # so try Google's Maven Central mirror first, resume
          # partial downloads (-C -), and abandon any attempt that
          # stalls below 100KB/s for 30s instead of riding it.
          mirrors="https://maven-central.storage-download.googleapis.com/maven2 https://repo1.maven.org/maven2 https://repo.maven.apache.org/maven2"
          for f in "android-all-instrumented-$ver.jar" "android-all-instrumented-$ver.pom"; do
            ok=""
            for base in $mirrors; do
              for attempt in 1 2; do
                if curl -fsSL -C - --speed-limit 102400 --speed-time 30 "$base/org/robolectric/android-all-instrumented/$ver/$f" -o "$dir/$f"; then ok=1; break; fi
                echo "Fetch of $f from $base (attempt $attempt) failed/stalled; retrying..."
                sleep 5
              done
              if [ -n "$ok" ]; then break; fi
            done
            if [ -z "$ok" ]; then echo "ERROR: could not pre-fetch $f from any mirror" >&2; exit 1; fi
          done
          ls -la "$dir"

      - name: Verify preinstalled Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          for dir in platform-tools build-tools; do
            if [ ! -d "$ANDROID_HOME/$dir" ]; then
              echo "ERROR: $ANDROID_HOME/$dir is missing." >&2
              exit 1
            fi
            echo "Found $dir:"
            ls -1 "$ANDROID_HOME/$dir"
          done

      - name: Download Gradle 9.3.1 (no gradlew in Studio export)
        run: |
          # Retry + integrity check: services.gradle.org intermittently
          # serves a truncated zip (two consecutive runs failed unzip
          # with "End-of-central-directory signature not found").
          ok=""
          for url in https://services.gradle.org/distributions/gradle-9.3.1-bin.zip https://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip https://mirrors.huaweicloud.com/gradle/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip; do
            for attempt in 1 2; do
              if curl -fsSL --retry 2 "$url" -o /tmp/gradle-9.3.1-bin.zip && unzip -tq /tmp/gradle-9.3.1-bin.zip >/dev/null; then ok=1; break; fi
              echo "Gradle download from $url (attempt $attempt) failed/corrupt; retrying..."
              sleep 8
            done
            if [ -n "$ok" ]; then break; fi
          done
          if [ -z "$ok" ]; then echo "ERROR: could not download a valid Gradle 9.3.1 zip from any mirror." >&2; exit 1; fi
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore stable signing keystore (one key for all builds)
        env:
          WATANI_KEYSTORE_BASE64: ${{ secrets.WATANI_KEYSTORE_BASE64 }}
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          echo "$WATANI_KEYSTORE_BASE64" | base64 -d > debug.keystore
          keytool -list -v -keystore debug.keystore -storetype "$WATANI_KEYSTORE_TYPE" -storepass "$WATANI_KEYSTORE_PASSWORD" -alias "$WATANI_KEY_ALIAS" \
            | grep -E "SHA1:" | tee debug-sha1.txt

      # Audit change (21 Nov 2026, CODE-001): the gate used to run
      # only 25 NAMED test classes out of 31 — the excluded ones
      # included the hardening suites, and the full suite carried a
      # failure nobody saw (a faulty probe in
      # FirstAidMarkdownParserTest, classified and fixed in the same
      # audit). The gate now runs the FULL unit-test suite; a red
      # test anywhere blocks the build.
      - name: Unit tests (full suite)
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          # Retry loop: dependency downloads intermittently hit
          # upstream 504s (GitHub Releases / Gradle CDN); Gradle caches
          # progress between attempts, so a retry usually completes.
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest :app:jacocoTestReport --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            app/build/reports/jacoco
          if-no-files-found: ignore
          retention-days: 14

      # Layer 3 of the AI-code review methodology (adopted
      # 22 Nov 2026, docs/RELEASE_CHECKLIST.md): integration /
      # end-to-end tests over the critical flows (launch gate,
      # update gate, offline full-dawra, cases gate, First Aid
      # gate, activation fail-closed journey, navigation state).
      # The full-suite step above already executes them; this named
      # step re-runs ONLY the integration package so a layer-3
      # failure is attributable at a glance, and publishes its
      # reports as their own artifact. Same retry pattern as the
      # other Gradle steps.
      - name: Layer 3 — integration tests (critical flows)
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest --tests "sy.medpro.watani.integration.*" --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Lint (new errors fail; legacy errors are baselined)
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          # Unified fixes package (Nov 2026): lint runs on every build.
          # gradle lint exits non-zero on lint ERRORS only by default
          # (warnings do not fail it), which is exactly the required
          # bar: surface errors, never break the build on legacy
          # warnings. The HTML/text reports are uploaded below.
          for attempt in 1 2 3; do
            if gradle :app:lintRelease --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.txt
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Detekt (new findings fail; legacy findings are baselined)
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          # Full-audit phase 0 gate (21 Nov 2026): same pattern as
          # lint — config/detekt/baseline.xml freezes today's
          # findings; any NEW detekt finding fails this step.
          for attempt in 1 2 3; do
            if gradle :app:detekt --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            app/build/reports/detekt/detekt.html
            app/build/reports/detekt/detekt.xml
            app/build/reports/detekt/detekt.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build final release APK
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          for attempt in 1 2 3; do
            if gradle assembleRelease --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done
          cp app/build/outputs/apk/release/app-release.apk medpro.apk

      # Audit gate (21 Nov 2026, SEC-R2): the built APK's signing
      # certificate MUST be the pinned 1.2.x release certificate.
      # If the keystore restore or the WATANI_* secrets ever go
      # missing, signing silently falls back to default/debug
      # credentials in gradle — this step makes that failure LOUD:
      # a wrongly-signed APK can never leave CI green (it would not
      # install over students' copies anyway, and shipping it would
      # burn a whole release cycle).
      - name: Verify release signature matches the pinned certificate
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found on runner"; exit 1; fi
          CERT_SHA256="$("$APKSIGNER" verify --print-certs medpro.apk | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "Built APK signer SHA-256: $CERT_SHA256"
          if [ "$CERT_SHA256" != "be41d53fcdb0e96739bb445efdf0c453d7fd0957888567dc5a92aea1b189c1b2" ]; then
            echo "::error::APK is NOT signed with the pinned release certificate (expected be41d53f...) — refusing to ship. Check the keystore restore step and WATANI_* secrets."
            exit 1
          fi
          echo "Signature matches the pinned release certificate."

      - name: Show stable SHA-1 (registered in Firebase once)
        run: |
          {
            echo "### Stable signing SHA-1 — registered in Firebase once"
            echo "Project: national-exam-8ecba, app: sy.medpro.watani"
            cat debug-sha1.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medpro
          path: medpro.apk
          retention-days: 14
          if-no-files-found: error

  # Reader device gate (build 1.2.54, doctor's order 27 Nov 2026):
  # 1.2.52 shipped a PDFium reader that kills the app on open on a
  # real phone while every Robolectric gate stayed green — the
  # native libraries never load under Robolectric, so that whole
  # crash class was invisible. This job runs the reader
  # instrumentation test (open a REAL Arabic booklet through the
  # shipped PdfViewerScreen, first page renders, vertical stack
  # scrolls) on an emulated Android runtime in the SAME workflow
  # run that produces the release APK. A red emulator gate must be
  # read together with the build job: no green run, no ship.
  emulator-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify preinstalled Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platform-tools" >/dev/null

      - name: Download Gradle 9.3.1 (no gradlew in Studio export)
        run: |
          ok=""
          for url in https://services.gradle.org/distributions/gradle-9.3.1-bin.zip https://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip https://mirrors.huaweicloud.com/gradle/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip; do
            for attempt in 1 2; do
              if curl -fsSL --retry 2 "$url" -o /tmp/gradle-9.3.1-bin.zip && unzip -tq /tmp/gradle-9.3.1-bin.zip >/dev/null; then ok=1; break; fi
              echo "Gradle download from $url (attempt $attempt) failed/corrupt; retrying..."
              sleep 8
            done
            if [ -n "$ok" ]; then break; fi
          done
          if [ -z "$ok" ]; then echo "ERROR: could not download a valid Gradle 9.3.1 zip from any mirror." >&2; exit 1; fi
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore stable signing keystore (debug builds sign from it too)
        env:
          WATANI_KEYSTORE_BASE64: ${{ secrets.WATANI_KEYSTORE_BASE64 }}
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          echo "$WATANI_KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Enable KVM (emulator hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Reader instrumentation test on emulator (open + render + scroll)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # ONE line on purpose: the emulator runner mangles
          # multi-line shell loops embedded in `script:` (run
          # 45995690147 died on a sh syntax error before Gradle
          # started). All logic lives in the repo script.
          script: sh scripts/run-reader-emulator-test.sh

      - name: Upload emulator logcat + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reader-reports
          path: |
            logcat-full.txt
            tombstones
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14

  # ─── بوابة القارئ على arm64: مُحاوَلة وموثّق تعذّرها ───
  # أُضيفت وظيفة emulator-reader-arm64 (macos-14) ببناء 1.2.54
  # لأن جهاز الدكتور arm64، لكن GitHub ألغاها فورًا بتشغيلين
  # متتاليين (45999926266 و46001293621) مع التنبيه الحرفي:
  # «The configuration 'macos-14-arm64-us-default' is not
  # supported» — عدّاءات macOS arm64 غير متاحة لهذا المستودع،
  # فأُزيلت الوظيفة حتى لا تلوّث كل تشغيل منتج بإلغاء فوري.
  # التغطية arm64 الحالية: تدقيق ساكن للـAPK المشحون (محاذاة
  # LOAD ‏16KB ومكتبات arm64) + بوابة x86_64 الديناميكية أعلاه
  # التي استنسخت كراش التزامن وأثبتت إصلاحه.

  # ─── بوابة إثبات الاتجاه الثنائي (1.2.55) ───
  # BidiProofTest: يعرض على محاكي حقيقي ترويسة بنك Step 2 بمدى
  # الصفحات المعزول، وسؤال الدكتور نفسه (بنوك 3، سؤال 1) بمشغّل
  # الأسئلة المشحون ونصّه الحي المُصلَح، وعيّنة شرح من بنك
  # الوطني — واللقطات الثلاث هي أرتيفاكت الإثبات البصري.
  emulator-bidi:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify preinstalled Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platform-tools" >/dev/null

      - name: Download Gradle 9.3.1 (no gradlew in Studio export)
        run: |
          ok=""
          for url in https://services.gradle.org/distributions/gradle-9.3.1-bin.zip https://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip https://mirrors.huaweicloud.com/gradle/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip; do
            for attempt in 1 2; do
              if curl -fsSL --retry 2 "$url" -o /tmp/gradle-9.3.1-bin.zip && unzip -tq /tmp/gradle-9.3.1-bin.zip >/dev/null; then ok=1; break; fi
              echo "Gradle download from $url (attempt $attempt) failed/corrupt; retrying..."
              sleep 8
            done
            if [ -n "$ok" ]; then break; fi
          done
          if [ -z "$ok" ]; then echo "ERROR: could not download a valid Gradle 9.3.1 zip from any mirror." >&2; exit 1; fi
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore stable signing keystore (debug builds sign from it too)
        env:
          WATANI_KEYSTORE_BASE64: ${{ secrets.WATANI_KEYSTORE_BASE64 }}
          WATANI_KEYSTORE_PASSWORD: <redacted>
          WATANI_KEY_ALIAS: watani
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          echo "$WATANI_KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Enable KVM (emulator hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bidi proof test on emulator (header + quiz + Watani sample)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WATANI_KEYSTORE_PASSWORD: <redacted>
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: <redacted>
          WATANI_KEYSTORE_TYPE: PKCS12
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh scripts/run-bidi-emulator-test.sh

      - name: Upload bidi proof screenshots + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-bidi-proof
          path: |
            bidi_screenshots
            logcat-bidi.txt
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14
