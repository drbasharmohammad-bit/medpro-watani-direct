# Build Watani (Studio source) — FINAL release APK via GitHub Actions
#
# Why this file exists (26 Oct 2026):
# - Local Gradle builds are blocked in this VM: the Gradle daemon starts but
#   the Java client never reaches it over loopback (proven with isolated
#   loopback tests; Gradle 8.7 and 9.1.0 fail identically). GitHub runners
#   do not have this defect, and cloud builds are the approved path since
#   10 Oct 2026 (private repo drbasharmohammad-bit/medpro-watani-app).
# - This workflow is written for the CURRENT Studio Kotlin source, NOT for
#   the old v1 React Native workflow (Node + android/ + assembleRelease).
#   Differences that matter:
#   * No gradlew in the Studio export, so Gradle 9.3.1 (the version pinned
#     in gradle/wrapper/gradle-wrapper.properties) is downloaded on the
#     runner and invoked directly.
#   * No debug.keystore in the export (and .gitignore excludes it), while
#     app/build.gradle.kts points debug signing at ${rootDir}/debug.keystore.
#     The workflow restores ONE stable keystore from GitHub secrets
#     (WATANI_KEYSTORE_BASE64) before building — see below.
#   * The build needs three secrets (set via the repo web UI; the
#     automation token has no secrets permission): WATANI_KEYSTORE_BASE64,
#     WATANI_KEYSTORE_PASSWORD, WATANI_KEY_PASSWORD.
#
# IMPORTANT — one stable signature for all builds (30 Oct 2026):
# Before this change every run generated a FRESH debug keystore, so every
# APK had a different signature: each build was a "different app" (fresh
# install required, local data lost) and a NEW SHA-1 fingerprint that had
# to be registered in Firebase before Google sign-in worked. Now one
# keystore signs every build: updates install over the old version, and
# the SHA-1 below is registered in Firebase ONCE (project
# national-exam-8ecba) and never changes. The next build after this
# change is the LAST one that needs an uninstall first (its signature
# differs from all ephemeral-key builds before it).
#
# Final release build (Nov 2026): same stable key as before, so the
# Firebase SHA-1 never changes; the artifact file is medpro.apk.

name: Build Watani Final APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/home-package]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify preinstalled Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          for dir in platform-tools build-tools; do
            if [ ! -d "$ANDROID_HOME/$dir" ]; then
              echo "ERROR: $ANDROID_HOME/$dir is missing." >&2
              exit 1
            fi
            echo "Found $dir:"
            ls -1 "$ANDROID_HOME/$dir"
          done

      - name: Download Gradle 9.3.1 (no gradlew in Studio export)
        run: |
          # Retry + integrity check: services.gradle.org intermittently
          # serves a truncated zip (two consecutive runs failed unzip
          # with "End-of-central-directory signature not found").
          ok=""
          for url in https://services.gradle.org/distributions/gradle-9.3.1-bin.zip https://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip https://mirrors.huaweicloud.com/gradle/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip; do
            for attempt in 1 2; do
              if curl -fsSL --retry 2 "$url" -o /tmp/gradle-9.3.1-bin.zip && unzip -tq /tmp/gradle-9.3.1-bin.zip >/dev/null; then ok=1; break; fi
              echo "Gradle download from $url (attempt $attempt) failed/corrupt; retrying..."
              sleep 8
            done
            if [ -n "$ok" ]; then break; fi
          done
          if [ -z "$ok" ]; then echo "ERROR: could not download a valid Gradle 9.3.1 zip from any mirror." >&2; exit 1; fi
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore stable signing keystore (one key for all builds)
        env:
          WATANI_KEYSTORE_BASE64: ${{ secrets.WATANI_KEYSTORE_BASE64 }}
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          echo "$WATANI_KEYSTORE_BASE64" | base64 -d > debug.keystore
          keytool -list -v -keystore debug.keystore -storetype "$WATANI_KEYSTORE_TYPE" -storepass "$WATANI_KEYSTORE_PASSWORD" -alias "$WATANI_KEY_ALIAS" \
            | grep -E "SHA1:" | tee debug-sha1.txt

      - name: Unit tests (unified fixes regressions)
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          # Retry loop: dependency downloads intermittently hit
          # upstream 504s (GitHub Releases / Gradle CDN); Gradle caches
          # progress between attempts, so a retry usually completes.
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest --tests "sy.medpro.watani.data.UnifiedFixesTest" --tests "sy.medpro.watani.data.BehavioralFixesTest" --tests "sy.medpro.watani.data.RestoreResponseTest" --tests "sy.medpro.watani.ui.ecg.EcgMathTest" --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done

      - name: Lint (new errors fail; legacy errors are baselined)
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          # Unified fixes package (Nov 2026): lint runs on every build.
          # gradle lint exits non-zero on lint ERRORS only by default
          # (warnings do not fail it), which is exactly the required
          # bar: surface errors, never break the build on legacy
          # warnings. The HTML/text reports are uploaded below.
          for attempt in 1 2 3; do
            if gradle :app:lintRelease --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.txt
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build final release APK
        env:
          WATANI_KEYSTORE_PASSWORD: ${{ secrets.WATANI_KEYSTORE_PASSWORD }}
          WATANI_KEY_ALIAS: watani
          WATANI_KEY_PASSWORD: ${{ secrets.WATANI_KEY_PASSWORD }}
          WATANI_KEYSTORE_TYPE: PKCS12
        run: |
          for attempt in 1 2 3; do
            if gradle assembleRelease --console=plain --max-workers=2; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Gradle attempt $attempt failed; retrying in 30s..."; sleep 30
          done
          cp app/build/outputs/apk/release/app-release.apk medpro.apk

      - name: Show stable SHA-1 (registered in Firebase once)
        run: |
          {
            echo "### Stable signing SHA-1 — registered in Firebase once"
            echo "Project: national-exam-8ecba, app: sy.medpro.watani"
            cat debug-sha1.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medpro
          path: medpro.apk
          retention-days: 14
          if-no-files-found: error
